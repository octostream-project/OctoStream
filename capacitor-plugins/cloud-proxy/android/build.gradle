apply plugin: 'com.android.library'

android {
    namespace = "com.octostream.cloudproxy"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34

    defaultConfig {
        minSdk = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdk = project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            consumerProguardFiles('consumer-rules.pro')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.annotation:annotation:1.7.0"
    implementation "androidx.collection:collection:1.4.0"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation "androidx.webkit:webkit:1.10.0"
    implementation "androidx.activity:activity:1.9.3"
    // SSH client puro-Java para el modo remoto-via-túnel: port-forward
    // local 1819/1820 al proxy del VPS (sin Tailscale ni binarios nativos).
    implementation "com.github.mwiede:jsch:0.2.26"
}
