apply plugin: 'com.android.library'

android {
    namespace = "com.octostream.torrentengine"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34

    defaultConfig {
        minSdk = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdk = project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            consumerProguardFiles('consumer-rules.pro')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // AppCompat+Activity: getActivity() y el ActivityResult del picker SAF
    // (misma dependencia que usa el plugin exoplayer).
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // libtorrent4j (sucesor mantenido de jlibtorrent, aldenml): Java API +
    // nativos por ABI. jlibtorrent 1.2.0.18 (2020) no bindeaba ningún socket
    // en Android 11+ (netlink prohibido, enum de interfaces vacío) — la
    // sesión arrancaba sin escucha y fetchMagnet siempre expiraba.
    // Esta build 2.1.0-39 además viene alineada a 16KB (Pixel/Android 15+).
    implementation 'org.libtorrent4j:libtorrent4j:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-x86_64:2.1.0-39'
}
