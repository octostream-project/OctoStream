apply plugin: 'com.android.library'

android {
    namespace = "com.octostream.torrentengine"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34

    defaultConfig {
        minSdk = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdk = project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            consumerProguardFiles('consumer-rules.pro')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // AppCompat+Activity: getActivity() y el ActivityResult del picker SAF
    // (misma dependencia que usa el plugin exoplayer).
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // jlibtorrent: Java API + native libtorrent binaries per Android ABI
    implementation 'com.frostwire:jlibtorrent:1.2.0.18'
    implementation 'com.frostwire:jlibtorrent-android-arm:1.2.0.18'
    implementation 'com.frostwire:jlibtorrent-android-arm64:1.2.0.18'
    implementation 'com.frostwire:jlibtorrent-android-x86:1.2.0.18'
    implementation 'com.frostwire:jlibtorrent-android-x86_64:1.2.0.18'
}
