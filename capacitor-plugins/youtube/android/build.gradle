apply plugin: 'com.android.library'

android {
    namespace = "com.octostream.youtube"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34

    defaultConfig {
        minSdk = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdk = project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            consumerProguardFiles('consumer-rules.pro')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation project(':capacitor-android')
    // NewPipeExtractor: extracts direct video URLs from YouTube without API key
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    // OkHttp for YoutubeDownloader (NewPipeExtractor requires a Downloader impl)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
