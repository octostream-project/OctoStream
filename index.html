<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="OctoStream - Media Center multiplataforma" />
    <link rel="icon" type="image/png" href="/logo-symbol.png" />
    <title>OctoStream</title>
    <style>
      /* Splash de carga (paridad con el SplashScreen nativo de Android):
         logo centrado hasta que React monta y reemplaza #root. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #020617;
      }
      #boot-splash img {
        width: 96px; height: auto; opacity: .9;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot-splash span {
        margin-top: 18px; font-family: system-ui, sans-serif;
        font-size: 13px; letter-spacing: .35em; color: #38bdf8;
        text-transform: uppercase; animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse { 50% { opacity: .35 } }
    </style>
  </head>
  <body class="bg-dark-950 text-white antialiased" style="background:#020617">
    <div id="root"><div id="boot-splash"><img src="/logo-symbol.png" alt="OctoStream" /><span>Cargando</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
